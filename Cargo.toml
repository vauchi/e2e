[package]
name = "vauchi-e2e-tests"
version = "0.1.0"
edition = "2024"
description = "End-to-end testing infrastructure for Vauchi"
license = "AGPL-3.0-or-later"

[features]
default = []
# Enable JUnit XML output for CI
junit = []

# Enable tracing-flame layer for profiling. Generates a `.folded` trace
# file under `e2e/artifacts/flame/` (or `$VAUCHI_FLAME_OUT`) that can be
# rendered to SVG via `inferno-flamegraph`. See `just flame-e2e <test>`.
flame = ["dep:tracing-flame"]

# TUI device automation via expectrl (PTY stack). Off by default to keep the
# default build graph free of nix 0.26 / bitflags 1.x / regex duplicates.
tui = ["dep:expectrl"]

# Build the seed-contacts helper bin. Off by default to keep fake/rand and the
# darling 0.20 subtree out of the default integration-test build.
seed-contacts = ["dep:fake", "dep:rand"]

[dependencies]
# Core library — git dependency for CI; patched to local path via .cargo/config.toml
# Tracks the tag `cli` ships (cli/Cargo.toml), because CI builds the E2E
# CLI binary from cli main — a pin behind it certifies a core the CLI
# under test is not running.
vauchi-core = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.60.1-dev.8", version = "=0.60.1" }
vauchi-app = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.60.1-dev.8", version = "=0.60.1", features = ["network-native-tls"] }
# Force vauchi-relay's transitive protocol dependency to the same Core tag
# so the relay and CLI agree on the wire format.
vauchi-protocol = { git = "https://gitlab.com/vauchi/core.git", tag = "v0.60.1-dev.8", version = "=0.60.1" }

# Async runtime
tokio = { version = "1", features = ["full", "process", "time", "sync"] }

# Async trait support
async-trait = "0.1"

# Temp directories for isolated test data
tempfile = "3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Duration parsing (for YAML scenario timeouts)
humantime = "2"
humantime-serde = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging — fmt subscriber is installed unconditionally by
# `test_logging::init` so subprocess relay/cli stderr (forwarded via
# `tracing::warn!(target = "relay", ...)`) is visible during tests.
# `ctor` is used to install the subscriber once at process start.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctor = "0.2"

# Profiling (enabled via `flame` feature)
tracing-flame = { version = "0.2", optional = true }

# PTY automation for TUI testing (optional — enable the `tui` feature)
expectrl = { version = "0.7", optional = true }

# HTTP client for Desktop test server (rustls to avoid native-tls/OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Hex encoding (orchestrator-injected OHTTP bundled key for cli subprocesses)
hex = "0.4"

# Random number generation for seeding contacts (optional — enable `seed-contacts` feature)
rand = { version = "0.8", optional = true }

# Fake data generation for seeding contacts (optional — enable `seed-contacts` feature)
fake = { version = "3", features = ["derive"], optional = true }

[dev-dependencies]
toml = "0.9"

# Relay for integration tests - use git dependency for CI, patched to local path via .cargo/config.toml
vauchi-relay = { git = "https://gitlab.com/vauchi/relay.git", branch = "main" }

# OHTTP key generation for stale-key error tests
ohttp = { version = "0.7", default-features = false, features = ["client", "rust-hpke"] }

# Mock gateway for IP obfuscation verification tests
axum = "0.7"
tower = "0.5"

# Key fingerprint verification
sha2 = "0.10"

# Bind-time socket options for port-allocation tests (SO_REUSEADDR)
socket2 = { version = "0.5", features = ["all"] }

[[bin]]
name = "seed-contacts"
path = "src/bin/seed_contacts.rs"
required-features = ["seed-contacts"]


# Development profile: fast builds, backtraces work (matches core)
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Test profile: skip full debug info, reduce binary size ~60%
[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"


