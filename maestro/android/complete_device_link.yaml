appId: app.vauchi
name: complete_device_link
---
# The existing device approves a joining device (vauchi/private#319),
# picking up where link_device left the app: on the invitation QR.
# Input: EXPECTED_CODE — the confirmation code the joining device shows.

# Fail on an unset input before touching the app.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof EXPECTED_CODE !== 'undefined' && String(EXPECTED_CODE) !== 'undefined' && String(EXPECTED_CODE).length > 0}
    label: "EXPECTED_CODE must be set (unset becomes the literal string \"undefined\")"

# No launchApp: it stops the app first, which would end the ceremony
# link_device started.
- extendedWaitUntil:
    visible: "Device Wants to Link"
    timeout: 60000

# The check a user makes: approve only the code the new device shows.
- assertVisible: ${EXPECTED_CODE}
- tapOn: "Codes Match — Verify Proximity"

- extendedWaitUntil:
    visible: "Device Linked"
    timeout: 60000
