# Android Maestro Flow: Setup Duress PIN
# Enables duress PIN (requires app password to be set first).
# Environment variables:
#   DURESS_PIN - 6-digit duress PIN (required, must differ from app password)

appId: app.vauchi

---

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof DURESS_PIN !== 'undefined' && String(DURESS_PIN) !== 'undefined' && String(DURESS_PIN).length > 0}
    label: "DURESS_PIN must be set (unset becomes the literal string \"undefined\")"

# Open Settings through the context bar's navigation overlay.
# ADR-066 navigation, addressed by label — see maestro/README.md.
- tapOn: "More"
- tapOn: "Settings"

# Open the Duress PIN screen from Settings. Scroll until the row is on
# screen rather than swiping a fixed amount — its position moves as
# Settings gains entries.
# visibilityPercentage below 100: the context bar overlays the bottom of
# the list, so a row can be reachable without ever being fully clear of it.
- scrollUntilVisible:
    element: "Duress PIN"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 30000
- tapOn: "Duress PIN"

# Verify duress is not yet enabled, then start setup.
- assertVisible: "Duress PIN not set up"
- tapOn: "Set Up PIN"

# Enter duress PIN, then confirm it on the following step. The entry and
# confirmation are two steps, not two fields on one screen; both inputs are
# addressed by their Core-supplied labels (verified on a Pixel 3a).
- assertVisible: "Set Duress PIN"
- tapOn: "Enter Duress PIN"
- inputText: ${DURESS_PIN}
- hideKeyboard
- tapOn: "Continue"

- assertVisible: "Confirm Duress PIN"
- tapOn: "Confirm Duress PIN"
- inputText: ${DURESS_PIN}
- hideKeyboard

# Commit. The confirm step's primary role is "Continue", not "Set".
- tapOn: "Continue"

# Wait for key derivation
- waitForAnimationToEnd:
    timeout: 15000

# Post-state. Unverified against the current UI: the walkthrough that
# supplied every label above stopped before committing a PIN to the test
# device, so this wording is inherited from the pre-ADR-066 flow. If it
# fails, read the screen and correct it here rather than assuming rot.
- assertVisible: "Enabled"

# Return to the home screen so the next flow starts from a known state.
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
