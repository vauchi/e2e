# Android Maestro Flow: Hide Contact
# Hides a contact from its detail screen (Actions → Hide contact).
# Environment variables:
#   CONTACT_NAME - Name of the contact to hide (required)

appId: app.vauchi

---


# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof CONTACT_NAME !== 'undefined' && String(CONTACT_NAME) !== 'undefined' && String(CONTACT_NAME).length > 0}
    label: "CONTACT_NAME must be set (unset becomes the literal string \"undefined\")"

# Bring the app to the front, after the input guards above so an unset
# variable still fails before the app is touched. Flows end with back
# presses that can exit to the launcher, so a flow that assumed the
# previous one left it foregrounded failed on its first tap.
- launchApp
- waitForAnimationToEnd

# Navigate to contacts. The Contacts tab lives behind More on the
# bottom bar, so every flow opens More first.
- tapOn: "More"
- tapOn: "Contacts"
- waitForAnimationToEnd
# Verify contact is visible
- assertVisible: ${CONTACT_NAME}
# Open the contact and hide it from the detail Actions menu (the shell
# no longer offers a long-press dialog on the list).
- tapOn: ${CONTACT_NAME}
- waitForAnimationToEnd
- tapOn: "Actions"
- tapOn: "Hide contact"
- waitForAnimationToEnd
# Back on the list the contact must be gone.
- pressKey: back
- waitForAnimationToEnd
- assertVisible: "Contacts"
- assertNotVisible: ${CONTACT_NAME}
