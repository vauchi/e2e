# Android Maestro Flow: Duress Unlock
# Unlocks the app with the duress PIN and verifies only decoy contacts are shown.
# Requires: app password set, duress PIN enabled, at least one decoy contact added.
# Environment variables:
#   DURESS_PIN - The duress PIN to enter (required)
#   DECOY_NAME - Expected decoy contact name (required)
#   REAL_CONTACT_NAME - A real contact name that should NOT appear (required)

appId: app.vauchi

---

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof DECOY_NAME !== 'undefined' && String(DECOY_NAME) !== 'undefined' && String(DECOY_NAME).length > 0}
    label: "DECOY_NAME must be set (unset becomes the literal string \"undefined\")"
- assertTrue:
    condition: ${typeof DURESS_PIN !== 'undefined' && String(DURESS_PIN) !== 'undefined' && String(DURESS_PIN).length > 0}
    label: "DURESS_PIN must be set (unset becomes the literal string \"undefined\")"
- assertTrue:
    condition: ${typeof REAL_CONTACT_NAME !== 'undefined' && String(REAL_CONTACT_NAME) !== 'undefined' && String(REAL_CONTACT_NAME).length > 0}
    label: "REAL_CONTACT_NAME must be set (unset becomes the literal string \"undefined\")"

# Relaunch app to trigger lock screen
- launchApp

# Wait for app password / PIN screen
- waitForAnimationToEnd:
    timeout: 10000

# Enter duress PIN (triggers duress mode)
- inputText: ${DURESS_PIN}
- hideKeyboard
- tapOn: "Unlock"

# Wait for duress mode to load
- waitForAnimationToEnd:
    timeout: 15000

# Navigate to contacts.
# ADR-066 navigation, addressed by label — see maestro/README.md.
- tapOn: "More"
- tapOn: "Contacts"

# Verify decoy contact IS visible
- assertVisible: ${DECOY_NAME}

# Verify real contact is NOT visible
- assertNotVisible: ${REAL_CONTACT_NAME}
