# Android Maestro Flow: Setup App Password
# Prerequisite for duress PIN — sets a separate password asked after biometric unlock.
# Environment variables:
#   APP_PASSWORD - Password to set (required)

appId: app.vauchi

---

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof APP_PASSWORD !== 'undefined' && String(APP_PASSWORD) !== 'undefined' && String(APP_PASSWORD).length > 0}
    label: "APP_PASSWORD must be set (unset becomes the literal string \"undefined\")"

# Ensure we are on the home screen, then open Settings via the gear icon.
- tapOn:
    id: "tab_my_info"
- tapOn:
    id: "home.settings"

# Scroll down to find App Password section
- swipe:
    direction: UP
    duration: 300

# Tap to set app password
- tapOn: "Change Password"

# Enter password and confirm
- assertVisible: "Set Password"
- tapOn: "Password"
- inputText: ${APP_PASSWORD}
- hideKeyboard
- tapOn: "Confirm Password"
- inputText: ${APP_PASSWORD}
- hideKeyboard

# Save
- tapOn: "Save"

# Wait for Argon2id hashing
- waitForAnimationToEnd:
    timeout: 15000

# Return to the home screen so the next flow starts from a known state.
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
