# Android Maestro Flow: Setup App Password
# Prerequisite for duress PIN — sets a separate password asked after biometric unlock.
# Environment variables:
#   APP_PASSWORD - Password to set (required)

appId: app.vauchi

---


# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof APP_PASSWORD !== 'undefined' && String(APP_PASSWORD) !== 'undefined' && String(APP_PASSWORD).length > 0}
    label: "APP_PASSWORD must be set (unset becomes the literal string \"undefined\")"

# Bring the app to the front, after the input guards above so an unset
# variable still fails before the app is touched. Flows end with back
# presses that can exit to the launcher, so a flow that assumed the
# previous one left it foregrounded failed on its first tap.
- launchApp
- waitForAnimationToEnd

# Open Settings through the context bar's navigation overlay.
# ADR-066 navigation, addressed by label — see maestro/README.md.
- tapOn: "More"
- tapOn: "Settings"

# Scroll down to find App Password section
# Scroll until the row is on screen rather than swiping a fixed amount —
# its position moves as Settings gains entries. visibilityPercentage below
# 100 because the context bar overlays the bottom of the list, so a row can
# be reachable without ever being fully clear of it.
- scrollUntilVisible:
    element: "Change Password"
    direction: DOWN
    visibilityPercentage: 40
    timeout: 30000

# Tap to set app password
- tapOn: "Change Password"

# Enter password and confirm
- assertVisible: "Set Password"
- tapOn: "Password"
- inputText: ${APP_PASSWORD}
- hideKeyboard
- tapOn: "Confirm Password"
- inputText: ${APP_PASSWORD}
- hideKeyboard

# Save
- tapOn: "Save"

# Wait for Argon2id hashing
- waitForAnimationToEnd:
    timeout: 15000

# Return to the home screen so the next flow starts from a known state.
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
