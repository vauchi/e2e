# Android Maestro Flow: Identity Purge (Scheduled Deletion + Cancel)
# Verifies the full identity purge lifecycle:
#   1. Navigate to Settings > Privacy & Data
#   2. Schedule deletion (7-day grace period)
#   3. Verify scheduled state is shown
#   4. Cancel deletion
#   5. Verify identity is active again
#
# Precondition: Identity must already exist (run create_identity.yaml first)

appId: app.vauchi

---

# Bring the app to the front, after the input guards above so an unset
# variable still fails before the app is touched. Flows end with back
# presses that can exit to the launcher, so a flow that assumed the
# previous one left it foregrounded failed on its first tap.
- launchApp
- waitForAnimationToEnd


# Open Settings through the context bar's navigation overlay.
# ADR-066 navigation, addressed by label — see maestro/README.md.
- tapOn: "More"
- waitForAnimationToEnd
- tapOn: "Settings"
- waitForAnimationToEnd

# Scroll to Privacy section and tap Delete Identity
- scrollUntilVisible:
    element: "Delete Identity"
    direction: DOWN
- tapOn: "Delete Identity"

# Confirm scheduling in alert dialog
- assertVisible: "Schedule Deletion"
- tapOn: "Schedule"

# Verify scheduled state
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Cancel Deletion"
    direction: DOWN
- assertVisible: "Cancel Deletion"

# Cancel the scheduled deletion
- tapOn: "Cancel Deletion"

# Verify back to active state — Delete Identity button reappears
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Delete Identity"
    direction: DOWN
- assertVisible: "Delete Identity"

# Return to the home screen so the next flow starts from a known state.
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
