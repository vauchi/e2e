# Android Maestro Flow: Send Emergency Broadcast
# Sends a configured emergency broadcast and verifies confirmation.
# Requires emergency broadcast to be configured first.

appId: app.vauchi

---

# Open Settings through the context bar's navigation overlay.
# ADR-066 navigation, addressed by label — see maestro/README.md.
- tapOn: "More"
- tapOn: "Settings"

# Scroll to Emergency Broadcast section
- swipe:
    direction: UP
    duration: 300

# Verify broadcast is configured
- assertVisible: "Configured"

# Send emergency broadcast
- tapOn: "Send Alert"

# Confirm in dialog
- assertVisible: "Send Emergency Alert"
- tapOn: "Send"

# Wait for delivery
- waitForAnimationToEnd:
    timeout: 10000

# Verify sent confirmation
- assertVisible: "sent"

# Return to the home screen so the next flow starts from a known state.
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
