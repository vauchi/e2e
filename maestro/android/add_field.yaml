appId: app.vauchi
name: Add Card Field (Android)
---
# Add a field to the user's contact card
# Environment variables:
#   FIELD_TYPE - Type of field (Email, Phone, Website, etc.)
#   FIELD_LABEL - Display label for the field (e.g., "Work", "Personal")
#   FIELD_VALUE - Value of the field

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof FIELD_LABEL !== 'undefined' && String(FIELD_LABEL) !== 'undefined' && String(FIELD_LABEL).length > 0}
    label: "FIELD_LABEL must be set (unset becomes the literal string \"undefined\")"
- assertTrue:
    condition: ${typeof FIELD_TYPE !== 'undefined' && String(FIELD_TYPE) !== 'undefined' && String(FIELD_TYPE).length > 0}
    label: "FIELD_TYPE must be set (unset becomes the literal string \"undefined\")"
- assertTrue:
    condition: ${typeof FIELD_VALUE !== 'undefined' && String(FIELD_VALUE) !== 'undefined' && String(FIELD_VALUE).length > 0}
    label: "FIELD_VALUE must be set (unset becomes the literal string \"undefined\")"

- launchApp

# Wait for app to be ready
- waitForAnimationToEnd

# Navigate to own card. ADR-066 navigation, addressed by label — see maestro/README.md.
# Narrow phones put the destination behind "More"; the Pixel 3a on
# android 0.1.4 (2026-10-24) shows it in the bottom bar directly.
- tapOn:
    text: "More"
    optional: true
- tapOn: "My Card"

# Wait for card to load
- waitForAnimationToEnd

# Start adding a new entry. android 0.1.4 shows "Add Entry" on the card;
# other layouts keep it in the secondary "Actions" overlay.
- runFlow:
    when:
      notVisible: "Add Entry"
    commands:
      - tapOn: "Actions"
- tapOn: "Add Entry"

# Select field type
- assertVisible: "Add to your card"
# A tap on a type was lost on the Pixel 3a (2026-10-24); tap again if the
# screen did not change.
- tapOn:
    text: ${FIELD_TYPE}
    retryTapIfNoChange: true

# Confirm the correct entry form opened
- assertVisible: "Add ${FIELD_TYPE}"

# Display name first, value last: hideKeyboard after the value field
# closes only the keyboard, while after the display name field it closed
# the form too, and a Back press there left the form with "Something
# went wrong" (Pixel 3a, android 0.1.4, 2026-10-24).
- tapOn: "Display Name (optional)"
- inputText: ${FIELD_LABEL}
- assertVisible: "Value"
- tapOn: "Value"
- inputText: ${FIELD_VALUE}
- hideKeyboard

# Make sure the keyboard is fully dismissed before tapping Save,
# otherwise the first tap only dismisses the keyboard and misses
# the Save button.
- waitForAnimationToEnd

# Save the field
- tapOn: "Save"

# Wait for save and return to the card view
- waitForAnimationToEnd:
    timeout: 5000

# Post-state: back on the card, which lists each entry's value and label
# as separate lines (android 0.1.4). Match on the label: the IME may
# auto-capitalise the typed value (backlog
# 2026-09-09-android-entry-value-input-autocapitalises).
- assertVisible: ${FIELD_LABEL}
- assertNotVisible: "Add ${FIELD_TYPE}"
