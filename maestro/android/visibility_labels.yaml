# Android Maestro Flow: Visibility Labels
# Creates a label and assigns a contact to it

appId: app.vauchi

---

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof CONTACT_NAME !== 'undefined' && String(CONTACT_NAME) !== 'undefined' && String(CONTACT_NAME).length > 0}
    label: "CONTACT_NAME must be set (unset becomes the literal string \"undefined\")"
- assertTrue:
    condition: ${typeof LABEL_NAME !== 'undefined' && String(LABEL_NAME) !== 'undefined' && String(LABEL_NAME).length > 0}
    label: "LABEL_NAME must be set (unset becomes the literal string \"undefined\")"

# Navigate to Labels
- tapOn: "Settings"
- tapOn: "Visibility Labels"

# Create a new label
- tapOn: "Create Label"
- inputText: "${LABEL_NAME}"
- hideKeyboard
- tapOn: "Save"
- waitForAnimationToEnd

# Verify label was created
- assertVisible: "${LABEL_NAME}"

# Add a contact to the label
- tapOn: "${LABEL_NAME}"
- tapOn: "Add Contact"
- tapOn: "${CONTACT_NAME}"
- tapOn: "Done"
- hideKeyboard
- waitForAnimationToEnd

# Verify contact was added
- assertVisible: "${CONTACT_NAME}"

# Go back
- pressKey: back
