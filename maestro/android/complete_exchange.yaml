appId: app.vauchi
name: Complete Exchange (Android)
---
# Complete a contact exchange using an exchange link from another device.
# Environment variables:
#   QR_DATA - a peer's `vauchi://exchange?...` link (required)
#
# Needs a real peer: the relay only releases the sender's card once both
# sides have deposited, so a link generated by this same device parks on
# "Waiting for Response" forever.

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof QR_DATA !== 'undefined' && String(QR_DATA) !== 'undefined' && String(QR_DATA).length > 0}
    label: "QR_DATA must be set (unset becomes the literal string \"undefined\")"

- launchApp
- waitForAnimationToEnd

# Delivered as a deep link rather than typed into a form. The manifest
# registers `vauchi://` with no host filter and Core routes every URI
# itself, so this is the path a received link actually takes. The
# pre-ADR-066 flow tapped "Add Contact" → "Enter Code Manually" → typed
# into "Paste or type the code"; none of those three affordances exist.
# Sending is now Exchange Now → Link, and receiving is this.
- openLink: ${QR_DATA}

# Core warns before adopting an out-of-band link, since a link carries no
# proximity evidence the way an in-person Glance does.
- assertVisible: "Exchange Request"
- tapOn: "Accept Exchange"

# Both deposits must land before the card is released, so the exchange is
# complete when this in-progress state clears. The success copy is
# deliberately not asserted — it has not been observed on device, and a
# two-device run should capture it before anything pins the wording.
- assertVisible: "Waiting for Response"
- extendedWaitUntil:
    notVisible: "Waiting for Response"
    timeout: 60000
