# Android Maestro Flow: Add Decoy Contact
# Adds a fake contact shown when duress PIN is entered.
# Requires duress PIN to be enabled first.
# Environment variables:
#   DECOY_NAME - Display name for the decoy contact (required)

appId: app.vauchi

---

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof DECOY_NAME !== 'undefined' && String(DECOY_NAME) !== 'undefined' && String(DECOY_NAME).length > 0}
    label: "DECOY_NAME must be set (unset becomes the literal string \"undefined\")"

# Ensure we are on the home screen, then open Settings via the gear icon.
- tapOn:
    id: "tab_my_info"
- tapOn:
    id: "home.settings"

# Scroll to Decoy Contacts section
- swipe:
    direction: UP
    duration: 300

# Verify decoy section is visible
- assertVisible: "Decoy Contacts"

# Open the decoy contacts screen
- tapOn: "Decoy Contacts"
- waitForAnimationToEnd

# Add a decoy contact
- tapOn: "New Decoy Name"
- inputText: ${DECOY_NAME}
- hideKeyboard
- tapOn: "Add Decoy"

- waitForAnimationToEnd

# Verify decoy contact appears in list
- assertVisible: ${DECOY_NAME}

# Return to the home screen so the next flow starts from a known state.
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
