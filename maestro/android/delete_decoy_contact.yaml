# Android Maestro Flow: Delete Decoy Contact
# Removes a decoy contact from the duress profile.
# Requires a decoy contact to exist.
# Environment variables:
#   DECOY_NAME - Name of the decoy contact to delete (required)

appId: app.vauchi

---

# Ensure we are on the home screen, then open Settings via the gear icon.
- tapOn:
    id: "tab_my_info"
- tapOn:
    id: "home.settings"

# Scroll to Decoy Contacts section
- swipe:
    direction: UP
    duration: 300

# Open the decoy contacts screen
- tapOn: "Decoy Contacts"
- waitForAnimationToEnd

# Verify decoy contact exists
- assertVisible: ${DECOY_NAME}

# Delete the decoy contact
- tapOn: "Delete"

# Confirm deletion
- tapOn: "Delete"

- waitForAnimationToEnd

# Verify decoy contact is gone
- assertNotVisible: ${DECOY_NAME}

# Return to the home screen so the next flow starts from a known state.
- pressKey: back
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd
