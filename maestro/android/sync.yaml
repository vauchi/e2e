appId: app.vauchi
name: Sync with Relay (Android)
---
# Trigger a sync with the relay server
# This pulls any pending updates from contacts

- launchApp

# Wait for app to be ready
- waitForAnimationToEnd

# Pull to refresh on the main contacts list
- assertVisible: "Contacts"
- swipe:
    direction: DOWN
    duration: 500

# Wait for sync to complete
- waitForAnimationToEnd:
    timeout: 10000

# Verify sync indicator disappears (or shows success)
- extendedWaitUntil:
    notVisible: "Syncing..."
    timeout: 15000

# Post-state assertions — Layer 3 gate (plan Task 3.2). After
# sync completes, the Contacts list view must still be the
# active screen (no error page, no unexpected modal). Weaker
# than a content-based assertion but catches the common
# "spinner hid because of error" failure mode.
- assertVisible: "Contacts"
- assertNotVisible: "Connection failed"
- assertNotVisible: "Error"

# Sync status is surfaced on the My Card caption, not in Settings.
# The pull-to-refresh above is sufficient to exercise the sync path;
# staying on the Contacts list without an error modal is the Layer 3
# post-condition we can assert from a single-device flow.
