appId: app.vauchi
name: Sync with Relay (Android)
---
# Trigger a sync with the relay server
# This pulls any pending updates from contacts

- launchApp

# Wait for app to be ready
- waitForAnimationToEnd

# Pull to refresh on the contacts list; the app opens on the card surface.
# ADR-066 navigation, addressed by label — see maestro/README.md.
- tapOn: "More"
- tapOn: "Contacts"
- waitForAnimationToEnd
- assertVisible: "Contacts"
# The shell has no pull-to-refresh; the core-driven Sync chip on the
# bottom bar is the only sync trigger. Its label follows the last
# outcome ("Sync", "Synced", "Sync failed"), so match all three. Core
# throttles syncs to one per minute; a tap inside that window is a
# silent no-op, so callers pace consecutive syncs at least 75 s apart.
- tapOn: "Sync(ed| failed)?"
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: "Contacts"
- assertNotVisible: "Sync failed"
- assertNotVisible: "Connection failed"
- assertNotVisible: "Error"
