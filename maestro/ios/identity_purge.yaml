# iOS Maestro Flow: Identity Purge (Scheduled Deletion + Cancel)
# Verifies the full identity purge lifecycle:
#   1. Navigate to Settings > Privacy & Data
#   2. Schedule deletion (7-day grace period)
#   3. Verify scheduled state is shown
#   4. Cancel deletion
#   5. Verify identity is active again
#
# Precondition: Identity must already exist (run create_identity.yaml first)

appId: app.vauchi.ios

---

# Navigate to More > Privacy (Delete Identity lives there per
# more.rs legal section; the Settings screen no longer carries it).
# Fast flick scrolls the list — slow swipes rubber-band and
# scrollUntilVisible trusts the off-screen a11y tree
# (problems/2026-07-18-ios-sectioned-action-rows-not-addressable).
- tapOn:
    id: "tab.more"
- waitForAnimationToEnd
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 200
- waitForAnimationToEnd
- tapOn: "Privacy"
- waitForAnimationToEnd

# Tap Delete Identity → review screen ("Review what will be deleted")
- tapOn: "Delete Identity"
- assertVisible: "Review what will be deleted"

# Confirm by wire id — the overview AND review buttons share the text
# "Delete Identity", so a text tap is ambiguous (hits the stale
# overview button). The review confirm is `confirm_delete`.
- tapOn:
    id: "confirm_delete"
- waitForAnimationToEnd:
    timeout: 15000

# Scheduled: app navigated back with the toast; re-enter Privacy via
# the fast flick (below-fold on small screens)
- tapOn:
    id: "tab.more"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 200
- waitForAnimationToEnd
- tapOn: "Privacy"
- waitForAnimationToEnd
- assertVisible: "Cancel Deletion"

# Cancel the scheduled deletion (id: cancel_deletion)
- tapOn: "Cancel Deletion"
- waitForAnimationToEnd:
    timeout: 10000

# Verify back to active state — Delete Identity reappears on the
# overview (the cancel completion navigates back to More; re-enter)
- tapOn:
    id: "tab.more"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 200
- waitForAnimationToEnd
- tapOn: "Privacy"
- waitForAnimationToEnd
- assertVisible: "Delete Identity"

# Go back to home
- back
