# iOS Maestro Flow: Emergency Shred (Panic Shred)
# Verifies the panic shred flow destroys all data:
#   1. Navigate to Settings > Emergency Shred
#   2. Tap Emergency Shred and confirm
#   3. Type DELETE confirmation
#   4. Verify data wiped / app resets to onboarding
#
# WARNING: This flow destroys the identity. Run last.
# Precondition: Identity must already exist (run create_identity.yaml first)

appId: app.vauchi.ios

---

# Navigate to More > Privacy > Panic Shred. Fast flick scrolls the
# list — slow swipes rubber-band and scrollUntilVisible trusts the
# off-screen a11y tree
# (problems/2026-07-18-ios-sectioned-action-rows-not-addressable).
- tapOn:
    id: "tab.more"
- waitForAnimationToEnd
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 200
- waitForAnimationToEnd
- tapOn: "Privacy"
- waitForAnimationToEnd

# Tap Panic Shred (Emergency Wipe flow)
- tapOn: "Panic Shred"

# Warning screen ("Immediately wipe everything", no grace period)
- assertVisible: "Emergency wipe"
- assertVisible: "Immediately wipe everything"

# Confirm — shred now
- tapOn: "Shred Everything"

# The wipe executes immediately; the UI does NOT navigate to onboarding
# on its own (problems/2026-07-18-ios-panic-shred-confirm-noop —
# WipeComplete re-renders the stale confirm screen). Relaunch to verify
# the post-wipe state from a cold start.
- waitForAnimationToEnd:
    timeout: 15000
- stopApp
- launchApp

# Verify data wiped — app cold-starts into onboarding
- assertVisible: "Create new identity"
