# iOS Maestro Flow: Configure Emergency Broadcast
# Sets up emergency broadcast with a trusted contact and custom message.
# Environment variables:
#   CONTACT_NAME - Trusted contact to receive alerts (required)
#   ALERT_MESSAGE - Custom emergency message (required)

appId: app.vauchi.ios

---

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof ALERT_MESSAGE !== 'undefined' && String(ALERT_MESSAGE) !== 'undefined' && String(ALERT_MESSAGE).length > 0}
    label: "ALERT_MESSAGE must be set (unset becomes the literal string \"undefined\")"
- assertTrue:
    condition: ${typeof CONTACT_NAME !== 'undefined' && String(CONTACT_NAME) !== 'undefined' && String(CONTACT_NAME).length > 0}
    label: "CONTACT_NAME must be set (unset becomes the literal string \"undefined\")"

# Navigate to Settings > Emergency Broadcast
- tapOn:
    id: "tab.more"
- tapOn: "Settings"
- tapOn: "Emergency Broadcast"

# Verify not yet configured
- assertVisible: "Not configured"

# Tap Configure
- tapOn: "Configure"
- waitForAnimationToEnd

# Select trusted contact
- tapOn: ${CONTACT_NAME}

# Enter custom message
- tapOn:
    id: "emergency_message_field"
- inputText: ${ALERT_MESSAGE}

# Save configuration
- tapOn: "Save"
- waitForAnimationToEnd

# Verify configured state
- assertVisible: "Configured"

# Go back
- back
