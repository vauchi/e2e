appId: app.vauchi.ios
name: Add Card Field
---
# Add a field to the user's contact card
# Environment variables:
#   FIELD_TYPE - Type of field (Email, Phone, Website, etc.)
#   FIELD_LABEL - Display label for the field (e.g., "Work", "Personal")
#   FIELD_VALUE - Value of the field

- launchApp

# Wait for app to be ready
- waitForAnimationToEnd

# Navigate to own card using iOS tab id.
- tapOn:
    id: "tab.myCard"

# Wait for card to load
- waitForAnimationToEnd

# Start adding a new entry
- tapOn: "Add Entry"

# Select field type. The ActionList row identifier is the core catalog key
# (lowercase), not the display name passed in FIELD_TYPE.
- assertVisible: "Add to your card"
- waitForAnimationToEnd
- tapOn:
    id: "email"

# Confirm the correct entry form opened
- assertVisible: "Add ${FIELD_TYPE}"
- waitForAnimationToEnd

# Enter display name (label) first. On iOS, moving focus from the value
# field to the label field can briefly re-layout the sheet and cause the
# next tap to land on the "Back" action, so we fill the label before the
# value to keep the form stable.
- tapOn:
    id: "field_label"
- inputText: ${FIELD_LABEL}

# Enter value by targeting the core input id.
- tapOn:
    id: "field_value"
- inputText: ${FIELD_VALUE}

# Save the field using its core action id. The iOS renderer keeps the
# action footer above the software keyboard, so this stays tappable.
- tapOn:
    id: "submit"

# Wait for save and return to the card view
- waitForAnimationToEnd:
    timeout: 5000

# Post-state: we must be back on the card view after the save completed.
# The persisted value may not be visible in the collapsed entry list, so we
# only assert on the navigation state and affordances.
- assertVisible:
    id: "tab.myCard"
- assertNotVisible: "Add ${FIELD_TYPE}"
