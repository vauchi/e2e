appId: app.vauchi.ios
name: Add Card Field
---
# Add a field to the user's contact card
# Environment variables:
#   FIELD_TYPE - Type of field (Email, Phone, Website, etc.)
#   FIELD_LABEL - Display label for the field (e.g., "Work", "Personal")
#   FIELD_VALUE - Value of the field

- launchApp

# Wait for app to be ready
- waitForAnimationToEnd

# Navigate to own card
- tapOn: "My Card"

# Wait for card to load
- waitForAnimationToEnd

# Start adding a new entry
- tapOn: "Add Entry"

# Select field type
- assertVisible: "Add to your card"
- tapOn: ${FIELD_TYPE}

# Confirm the correct entry form opened
- assertVisible: "Add ${FIELD_TYPE}"

# Enter value
- assertVisible: "Value"
- tapOn: "Value"
- inputText: ${FIELD_VALUE}

# Enter display name (label)
- tapOn: "Display Name (optional)"
- inputText: ${FIELD_LABEL}

# Save the field
- tapOn: "Save"

# Wait for save and return to the card view
- waitForAnimationToEnd:
    timeout: 5000

# Post-state: we must be back on the card view and the entry list affordance
# must appear, proving the entry was persisted.
- assertVisible: "My Card"
- assertVisible: "Entry View"
- assertNotVisible: "Add ${FIELD_TYPE}"
