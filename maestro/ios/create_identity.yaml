appId: app.vauchi.ios
name: Create Identity
---
# Create a new identity with the given name
# Environment variables:
#   NAME - Display name for the identity (required)
#   VAUCHI_RELAY_URL - Relay server URL (optional, uses default if not set)
#
# Screen sequence verified against
# `core/vauchi-app/src/ui/onboarding.rs` at core v0.20.3:
#   identity_check -> default_name -> groups_setup -> contact_info -> what_next

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof NAME !== 'undefined' && String(NAME) !== 'undefined' && String(NAME).length > 0}
    label: "NAME must be set (unset becomes the literal string \"undefined\")"

- launchApp:
    clearState: true

- waitForAnimationToEnd

# -- identity_check --------------------------------------------
- assertVisible: "Create new identity"
- tapOn: "Create new identity"

# -- default_name ----------------------------------------------
- assertVisible: "What's your name?"
- tapOn: "Display name input"
- inputText: ${NAME}
- tapOn: "Continue"

# -- groups_setup: continue without optional groups -------------
- assertVisible: "Choose your groups"
- tapOn: "Continue"

# -- contact_info: continue without optional fields -------------
- assertVisible: "Add contact info"
- tapOn: "Continue"

# -- what_next: finish onboarding, go to main app ---------------
- assertVisible: "What would you like to do?"
- tapOn: "Start using the app"

# Wait for identity generation and transition to main app
- waitForAnimationToEnd:
    timeout: 15000

# Post-state: the onboarding flow must have advanced off the
# "What would you like to do?" screen.
- assertNotVisible: "What would you like to do?"

# Verify the name came from Core persistence after a fresh app launch.
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: ${NAME}
