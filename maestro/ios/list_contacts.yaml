appId: app.vauchi.ios
name: List Contacts
---
# List all contacts and output their names
# Output: Contact names are written to ${MAESTRO_OUTPUT_PATH}
#
# Format: One contact name per line

# Fail on an unset input before touching the app. Maestro interpolates
# ${VAR} as JavaScript, so an unset variable is typed as the literal
# string "undefined" and the flow's own assertions then confirm it —
# a device was found carrying an identity named exactly that.
# See backlog/2026-08-09-maestro-flows-accept-unset-inputs.md
- assertTrue:
    condition: ${typeof MAESTRO_OUTPUT_PATH !== 'undefined' && String(MAESTRO_OUTPUT_PATH) !== 'undefined' && String(MAESTRO_OUTPUT_PATH).length > 0}
    label: "MAESTRO_OUTPUT_PATH must be set (unset becomes the literal string \"undefined\")"

- launchApp

# Wait for app to be ready
- waitForAnimationToEnd

# Navigate to contacts list
- assertVisible: "Contacts"

# Ensure we're on the contacts tab
- tapOn: "Contacts"

# Wait for list to load
- waitForAnimationToEnd

# Scroll through the entire list to ensure all contacts are loaded
- repeat:
    times: 3
    commands:
      - swipe:
          direction: UP
          duration: 300

# Scroll back to top
- repeat:
    times: 3
    commands:
      - swipe:
          direction: DOWN
          duration: 300

# Extract contact names from the list
# This relies on contacts having an accessibility identifier pattern
- evalScript: |-
    const contacts = [];
    const elements = maestro.findElements({
      className: 'ContactListItem'
    });

    for (const el of elements) {
      if (el.text) {
        contacts.push(el.text);
      }
    }

    const fs = require('fs');
    fs.writeFileSync(MAESTRO_OUTPUT_PATH, contacts.join('\n'));

# Also try using accessibility identifiers
- runFlow:
    when:
      visible:
        id: "contact_list"
    commands:
      - evalScript: |-
          const listEl = maestro.findElement({ id: 'contact_list' });
          const children = listEl.children || [];
          const names = children.map(c => c.accessibilityLabel || c.text).filter(Boolean);

          const fs = require('fs');
          fs.writeFileSync(MAESTRO_OUTPUT_PATH, names.join('\n'));
