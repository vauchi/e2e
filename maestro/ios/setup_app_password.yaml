# iOS Maestro Flow: Set Up App Password
# Rewritten 2026-07-18 against the ChangePassword wizard (the old flow
# expected app-password setup inside the Duress PIN screen — that UX is
# gone; app password now lives at Settings > Change Password).
#
# Precondition: Identity must already exist (run create_identity.yaml first)
# Environment variables:
#   APP_PASSWORD - Password to set (required)

appId: app.vauchi.ios

---

# Navigate to More > Settings > Change Password
- tapOn:
    id: "tab.more"
- tapOn: "Settings"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Change Password"
    direction: DOWN
- tapOn: "Change Password"

# Setup wizard (no current-password field while not yet enabled).
# ORDER MATTERS: fill CONFIRM first (keyboard down, field visible at
# its position); once new_password is focused and the keyboard is up,
# the layout compresses and the footer covers the confirm field, making
# it unreachable (problems/2026-07-18-ios-securefield-not-automatable).
- assertVisible: "Set Password"
- tapOn:
    id: "confirm_password"
- inputText: ${APP_PASSWORD}
- tapOn:
    id: "new_password"
- inputText: ${APP_PASSWORD}

# Save (Argon2id hashing takes a moment)
- tapOn: "Save"
- waitForAnimationToEnd:
    timeout: 15000

# Post-state: back on the Settings screen (Complete navigates back).
# Assert the Settings profile section, not "Change Password" (which is
# below the fold).
- assertVisible: "Profile"
