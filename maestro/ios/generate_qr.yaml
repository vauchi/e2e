appId: app.vauchi.ios
name: Generate QR Code
---
# Generate an exchange payload for contact exchange.
# Output: presentation-only screenshot in Maestro's run artifacts
#
# The flow navigates to the exchange screen and captures the shareable
# link because on the iOS simulator BLE-dependent modes (Magic/Glance)
# fail immediately.

- launchApp

# Wait for app to be ready
- waitForAnimationToEnd

# Navigate to the exchange mode picker.
# Phase 1.E (2026-05-11) moved exchange generation behind the core-driven
# mode selection screen. On the iOS simulator the BLE/Magic and Glance
# hero actions require Bluetooth, so we open "Other ways to connect" and
# pick Link — the relay-based exchange path that does not need radios.
- tapOn:
    id: "tab.exchange"
- assertVisible: "Exchange Mode"
- tapOn: "Other ways to connect"
- waitForAnimationToEnd
- tapOn:
    id: "mode:link"

# Wait for the relay exchange payload to render.
- waitForAnimationToEnd:
    timeout: 10000

# The Link screen exposes a shareable vauchi://exchange URL.
- assertVisible: "Share Link"
- assertVisible: "Send this link to exchange contacts"

# Take screenshot for exchange-data extraction.
- takeScreenshot: vauchi_exchange_link

# Post-state assertion — the exchange screen must stay active after the
# payload is rendered; a regression that auto-dismisses would have still
# captured a screenshot from the brief moment before dismissal.
- assertVisible: "Share Link"
