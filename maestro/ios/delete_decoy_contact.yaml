# iOS Maestro Flow: Delete Decoy Contact
# Rewritten 2026-07-18: decoy management now lives at
# Settings > Decoy Contacts with tap-row → InlineConfirm delete
# (was Settings > Duress PIN with a per-row trash button).
#
# Precondition: a decoy contact exists (run add_decoy_contact.yaml first)
# Environment variables:
#   DECOY_NAME - Name of the decoy contact to delete (required)

appId: app.vauchi.ios

---

# Navigate to More > Settings > Decoy Contacts by wire ids (deterministic
# — text taps on sectioned rows are flaky, see
# problems/2026-07-18-ios-sectioned-action-rows-not-addressable).
- tapOn:
    id: "tab.more"
- waitForAnimationToEnd
# The More list keeps its scroll position across navigations — scroll
# back to top so the Settings row is on-screen before tapping
- swipe:
    direction: DOWN
    duration: 300
- waitForAnimationToEnd
- tapOn:
    id: "more_menu.primary.settings"
    repeat: 2
    delay: 800
- waitForAnimationToEnd

# Decoy Contacts lives below the fold — fast flick to reveal, then tap
# by id (security.decoy_contacts)
- swipe:
    start: "50%,70%"
    end: "50%,40%"
    duration: 200
- waitForAnimationToEnd
- tapOn:
    id: "security_backup.decoy_contacts"
    retryTapIfNoChange: true

# Verify the decoy exists
- assertVisible: ${DECOY_NAME}

# Tap the decoy row → inline confirm appears
- tapOn: ${DECOY_NAME}
- waitForAnimationToEnd

# Confirm removal
- tapOn: "Remove"
- waitForAnimationToEnd

# Verify the decoy is gone
- assertNotVisible: ${DECOY_NAME}

# Go back
- back
