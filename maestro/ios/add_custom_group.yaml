appId: app.vauchi.ios
name: Add Custom Group During Onboarding
---
# Regression test for `2026-04-20-onboarding-custom-group-add-invisible`.
#
# Today's bug: the `groups_setup` screen's custom-group TextInput has
# no commit affordance. Tapping "Continue" silently auto-adds the
# pending text then navigates away — on iOS the user sees the
# ContactInfo screen appear without confirmation; their typed entry
# is lost from the visible flow.
#
# Expected behaviour (post-fix):
#  1. User types a custom group name.
#  2. User taps the commit affordance.
#  3. The group appears in the selected list on the same screen.
#  4. User can repeat without leaving.
#
# Sibling to Android's `add_custom_group.yaml`. Gate is `just e2e-maestro-critical`.

- launchApp:
    clearState: true

- waitForAnimationToEnd

# -- Advance to the groups_setup screen -------------------------

- assertVisible: "Create new identity"
- tapOn: "Create new identity"

- assertVisible: "What's your name?"
- tapOn:
    id: "display_name"
- inputText: "Maestro Test"
- tapOn:
    id: "continue"

- assertVisible: "Add a custom group"

# -- First custom group -----------------------------------------

# The field is the last scrollable component and renders clipped at
# the bottom edge of the scroll region (footer is now a layout
# sibling, so nothing overlays it — problems/2026-07-18-ios-custom-
# group-field-unfocusable). Flick it fully into view, then tap by id.
# The swipe must carry explicit start/end INSIDE the scroll region —
# maestro's bare `direction: UP` swipe starts on the footer and the
# ScrollView never moves (verified on iPhone 16e).
- swipe:
    start: "50%,55%"
    end: "50%,35%"
    duration: 200
# Let the scroll settle before the driver re-queries the hierarchy;
# otherwise the tap resolves against the pre-scroll a11y frame.
- waitForAnimationToEnd
- tapOn:
    id: "custom_group"
- inputText: "MyCustomGroup"

# Commit affordance. `submit_custom_group` stays disabled until the
# textChanged events reach core (`enabled: !custom_group_input
# .trim().is_empty()` at core/vauchi-app/src/ui/onboarding.rs:463);
# waitForAnimationToEnd lets the rebuild enable it before the tap.
- waitForAnimationToEnd
- tapOn:
    id: "submit_custom_group"

- waitForAnimationToEnd

- assertVisible: "MyCustomGroup"
- assertVisible: "Add a custom group"

# -- Second custom group -----------------------------------------

# The committed group joined the toggle list, pushing the field down
# again — flick it back into view before tapping (explicit start/end
# inside the scroll region, same as above).
- swipe:
    start: "50%,55%"
    end: "50%,35%"
    duration: 200
- waitForAnimationToEnd
- tapOn:
    id: "custom_group"
- inputText: "AnotherGroup"
- waitForAnimationToEnd
- tapOn:
    id: "submit_custom_group"

- waitForAnimationToEnd

- assertVisible: "MyCustomGroup"
- assertVisible: "AnotherGroup"
