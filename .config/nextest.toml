# OHTTP-default orchestrators spawn relay and proxy processes; limiting
# their aggregate concurrency prevents CI CPU starvation and port races.
[test-groups.relay-tests]
max-threads = 4

[[profile.default.overrides]]
filter = "binary(=it)"
test-group = "relay-tests"

[[profile.default.overrides]]
filter = "test(/five_user_exchange::integration_five_user_exchange/) | test(/onboarding_flow::test_time_to_value_under_2_minutes/) | test(/multi_device_sync::integration_six_device_exchange_and_update_convergence/)"
threads-required = "num-test-threads"

[profile.ci.junit]
# Path is relative to nextest's output dir (target/nextest/ci/), not project root.
path = "junit.xml"

[[profile.ci.overrides]]
filter = "binary(=it)"
test-group = "relay-tests"

[[profile.ci.overrides]]
filter = "test(/five_user_exchange::integration_five_user_exchange/) | test(/onboarding_flow::test_time_to_value_under_2_minutes/) | test(/multi_device_sync::integration_six_device_exchange_and_update_convergence/)"
threads-required = "num-test-threads"
